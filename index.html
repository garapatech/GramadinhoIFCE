<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gramado IFCE</title>
    <meta
      name="description"
      content="Mapa 3D interativo do gramado do IFCE com personagem controlável."
    />
  </head>
  <body>
    <div id="app">
      <div id="hud" aria-hidden="true">Gramado IFCE</div>
      <div id="status" aria-live="polite"></div>
      <div id="minimap" aria-hidden="true">
        <div id="minimap-title">Mapa</div>
        <canvas id="minimap-canvas" width="220" height="220"></canvas>
      </div>
      <div id="speech" aria-live="polite">
        <div id="speech-header">
          <span id="speech-name">Aviso</span>
          <span id="speech-hint">[E]</span>
        </div>
        <div id="speech-body"></div>
      </div>
      <canvas id="scene"></canvas>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
